name: maimai-kids-order
display_name: 麦麦遛娃点餐师
version: 1.0.0
description: >-
  两大一小家庭场景的麦当劳点餐决策助手：识别家庭上下文（人数/预算/忌口/要开心乐园餐），
  基于麦当劳 MCP 实时门店/菜单/券/活动数据，计算并固定输出「全家稳 / 孩子开心 / 家长友好」
  三套点餐方案，主动提示甜饮换牛奶/苹果片；未收到用户字面"确认下单"绝不触发下单。
triggers:
  - "/遛娃点餐"
  - "/带娃吃麦"
  - "/家庭点餐"
entry: prompts/main.md
runtime: workbuddy-skill
